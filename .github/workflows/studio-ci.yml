name: Studio CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-integration:
    name: ${{ matrix.name }} Source Integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: Linux
            os: ubuntu-latest

    steps:
      - name: Checkout SpectralShipGen Studio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout private SpectralShipGen Library
        uses: actions/checkout@v7
        with:
          repository: SpectralHorse/SpectralShipGen
          ref: v1.0.0-rc.1
          token: ${{ secrets.SPECTRAL_SHIP_GEN_CI_TOKEN }}
          path: SpectralShipGen
          persist-credentials: false

      - name: Install Linux SFML build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Configure Studio against Library source checkout
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DSPECTRAL_SHIP_GEN_LIBRARY_SOURCE_DIR="${{ github.workspace }}/SpectralShipGen"
          -DSPECTRAL_SHIP_GEN_FETCH_LIBRARY=OFF
          -DSPECTRAL_SHIP_GEN_FETCH_SFML=ON
          -DSFML_BUILD_AUDIO=OFF
          -DSFML_BUILD_NETWORK=OFF
          -DSFML_BUILD_EXAMPLES=OFF
          -DSFML_BUILD_DOC=OFF

      - name: Build Studio, Diagnostics, and Preview regression
        run: >-
          cmake --build build --config Release --parallel --target
          SpectralShipGenStudio
          SpectralShipGenStudioDiagnostics
          SpectralShipGenStudioPreviewRegression

      - name: Run Preview NORMAL regression
        run: ctest --test-dir build -C Release -L normal --output-on-failure

  installed-integration:
    name: Linux Installed Library Integration
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout SpectralShipGen Studio
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Checkout private SpectralShipGen Library
        uses: actions/checkout@v7
        with:
          repository: SpectralHorse/SpectralShipGen
          ref: v1.0.0-rc.1
          token: ${{ secrets.SPECTRAL_SHIP_GEN_CI_TOKEN }}
          path: SpectralShipGen
          persist-credentials: false

      - name: Install Linux SFML build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libx11-dev \
            libxrandr-dev \
            libxcursor-dev \
            libxi-dev \
            libudev-dev \
            libfreetype6-dev \
            libgl1-mesa-dev \
            libegl1-mesa-dev

      - name: Configure Library for installation
        run: >-
          cmake -S SpectralShipGen -B library-build
          -DCMAKE_BUILD_TYPE=Release
          -DSPECTRAL_SHIP_GEN_BUILD_DIAGNOSTICS=ON
          -DSPECTRAL_SHIP_GEN_BUILD_DIAGNOSTICS_CLI=OFF
          -DSPECTRAL_SHIP_GEN_BUILD_EXAMPLES=OFF
          -DSPECTRAL_SHIP_GEN_BUILD_CORE_REGRESSION=OFF
          -DSPECTRAL_SHIP_GEN_BUILD_PUBLIC_HEADER_CHECKS=OFF

      - name: Build and install Library
        run: |
          cmake --build library-build --config Release --parallel
          cmake --install library-build --config Release --prefix "${{ github.workspace }}/library-install"

      - name: Configure Studio against installed Library package
        run: >-
          cmake -S . -B build-installed
          -DCMAKE_BUILD_TYPE=Release
          -DBUILD_TESTING=ON
          -DCMAKE_PREFIX_PATH="${{ github.workspace }}/library-install"
          -DSPECTRAL_SHIP_GEN_LIBRARY_SOURCE_DIR=
          -DSPECTRAL_SHIP_GEN_FETCH_LIBRARY=OFF
          -DSPECTRAL_SHIP_GEN_FETCH_SFML=ON
          -DSFML_BUILD_AUDIO=OFF
          -DSFML_BUILD_NETWORK=OFF
          -DSFML_BUILD_EXAMPLES=OFF
          -DSFML_BUILD_DOC=OFF

      - name: Build Studio against installed Library
        run: >-
          cmake --build build-installed --config Release --parallel --target
          SpectralShipGenStudio
          SpectralShipGenStudioDiagnostics
          SpectralShipGenStudioPreviewRegression

      - name: Run installed-Library Preview NORMAL regression
        run: ctest --test-dir build-installed -C Release -L normal --output-on-failure
